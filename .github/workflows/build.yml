name: Build

on:
  #push:
  #  branches:
  #    - main
  #    - develop
  #schedule:
  #  - cron: '55 22 * * 0'
  workflow_dispatch:

jobs:

  list-images:

    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.list.outputs.build }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:

      - name: Deep checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: List images
        id: list
        run: |
          sha_prev=$(git rev-parse HEAD~1)
          if [ "${{ github.event_name }}" == "push" ]; then
            matrix=$(git diff --name-only --diff-filter=d $sha_prev ${{ github.sha }} | grep -Eo '^images(/[^/]+){3}' | xargs -r -n1 -d'\n' dirname | sort -u | jq -R -s -c 'split("\n")|map(select(.|length>0))|{"include":map({"path":.})}')
          else
            matrix=$(find images -type d -mindepth 2 -maxdepth 2 | jq -R -s -c 'split("\n")|map(select(.|length>0))|{"include":map({"path":.})}')
          fi
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "build=$(jq '.include|length>0' <<<$matrix)" >> $GITHUB_OUTPUT

  build:
    if: ${{ needs.list-images.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    needs: [ list-images ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list-images.outputs.matrix) }}

    steps:
      - name: Get image name and tag
        id: image
        run: |
          ref=${{ github.ref }}
          ref=${ref#refs/heads/}
          echo "IMAGE=$(basename $(dirname ${{ matrix.path }}))" >> $GITHUB_OUTPUT
          echo "TAG=$(basename ${{ matrix.path }})" >> $GITHUB_OUTPUT
          echo "PATH=${{ matrix.path }}" >> $GITHUB_OUTPUT
          echo "TAG_SUFFIX=$( [[ $ref =~ ^(refs/heads/)?main$ ]] || echo .${ref//\//-})" >> $GITHUB_OUTPUT
      
      - name: Shallow checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READWRITE_TOKEN }}

      - name: Build image (local, no push)
        id: docker_build_local
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.image.outputs.PATH }}
          file: ${{ steps.image.outputs.PATH }}/Dockerfile
          push: false
          load: true
          tags: smoke-test:${{ github.run_id }}

      - name: Smoke test - image starts without exec errors
        run: |
          cid=$(docker run -d smoke-test:${{ github.run_id }})
          sleep 8
          status=$(docker inspect -f '{{.State.Status}}' "$cid")
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          if [ "$status" = "running" ]; then
            echo "OK: il container è avviato e resta in esecuzione (immagine tipo servizio)."
          elif [ "$exit_code" = "126" ] || [ "$exit_code" = "127" ]; then
            echo "::error::Il comando di avvio non è eseguibile (exit $exit_code):"
            docker logs "$cid"
            docker rm -f "$cid" >/dev/null
            exit 1
          else
            echo "OK: il container è terminato da solo con exit code $exit_code (immagine tipo tool)."
          fi
          docker rm -f "$cid" >/dev/null 2>&1 || true

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.image.outputs.PATH }}
          file: ${{ steps.image.outputs.PATH }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ steps.image.outputs.IMAGE }}:${{ steps.image.outputs.TAG }}${{ steps.image.outputs.TAG_SUFFIX }}
