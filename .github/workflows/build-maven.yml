name: Build Maven

on:
  #push:
  #  branches:
  #    - main
  #    - develop
  #schedule:
  #  - cron: '55 22 * * 0'
  workflow_dispatch:
    inputs:
      images:
        description: "Lista delle immagini da buildare"
        required: true
        default: '["3.6-openjdk-11","3.6-openjdk-8","3.8-openjdk-11","3.8-openjdk-17","3.9-eclipse-temurin-21","3.9-eclipse-temurin-25"]'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJSON(github.event.inputs.images) }}

    steps:      
      - name: Shallow checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READWRITE_TOKEN }}

      - name: Build image (local, no push)
        uses: docker/build-push-action@v4
        with:
          context: images/maven/${{ matrix.path }}
          file: images/maven/${{ matrix.path }}/Dockerfile
          push: false
          load: true
          tags: smoke-test:${{ github.run_id }}

      - name: Smoke test - image starts without exec errors
        run: |
          cid=$(docker run -d smoke-test:${{ github.run_id }})
          sleep 8
          status=$(docker inspect -f '{{.State.Status}}' "$cid")
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          if [ "$status" = "running" ]; then
            echo "OK: il container è avviato e resta in esecuzione (immagine tipo servizio)."
          elif [ "$exit_code" = "126" ] || [ "$exit_code" = "127" ]; then
            echo "::error::Il comando di avvio non è eseguibile (exit $exit_code):"
            docker logs "$cid"
            docker rm -f "$cid" >/dev/null
            exit 1
          else
            echo "OK: il container è terminato da solo con exit code $exit_code (immagine tipo tool)."
          fi
          docker rm -f "$cid" >/dev/null 2>&1 || true

      - name: Build & Push
        uses: docker/build-push-action@v4
        with:
          context: images/maven/${{ matrix.path }}
          file: images/maven/${{ matrix.path }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/maven:${{ matrix.path }}
